name: Voice Fabric PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check isolated Windows qualification runner boundaries
        run: |
          node --check tests/studio-live-windows-gate.mjs
          node tests/studio-live-windows-gate.mjs --self-test
      - name: Parse the saved Windows qualification script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Qualify-VoiceStudioCandidate.ps1), [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count) { $parseErrors | Format-List; exit 1 }
      - name: Install Chromium for the Studio browser gates
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify real browser audio and Studio controls
        run: npm run test:browser
      - name: Verify Studio graphics lifecycle
        run: npm run test:graphics
      - name: Verify Studio publication through the actual Python publisher
        run: npm run test:owner
      - name: Verify cancellation races and provider sample rates
        run: npm run test:races
      - name: Verify browser preparation remains cancellable after switching
        run: npm run test:prepare
