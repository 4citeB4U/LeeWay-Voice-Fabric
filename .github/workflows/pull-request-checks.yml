name: Voice Fabric PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
